<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agricultural Loans - AgriSphere AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🌾 Agricultural Loans</h1>
        <p>Explore loan options available for agricultural activities</p>
    </header>

    <section class="emi-calculator">

    <h2>🧮 EMI Calculator</h2>

    <p>
        Calculate your estimated monthly loan payment.
    </p>

    <div class="emi-form">

        <label for="loanAmount">
            Loan Amount (₹)
        </label>

        <input
            type="number"
            id="loanAmount"
            value="500000"
            min="1000"
        >

        <label for="interestRate">
            Annual Interest Rate (%)
        </label>

        <input
            type="number"
            id="interestRate"
            value="8"
            min="0"
            step="0.1"
        >

        <label for="loanTenure">
            Loan Tenure (Years)
        </label>

        <input
            type="number"
            id="loanTenure"
            value="5"
            min="1"
            max="30"
        >

        <button
            type="button"
            onclick="calculateEMI()"
        >
            Calculate EMI
        </button>

    </div>

    <div id="emi-result" class="emi-result">

        <h3>Estimated Results</h3>

        <p>
            Monthly EMI:
            <strong id="monthly-emi">₹0</strong>
        </p>

        <p>
            Total Interest:
            <strong id="total-interest">₹0</strong>
        </p>

        <p>
            Total Amount Payable:
            <strong id="total-payment">₹0</strong>
        </p>

    </div>

</section>
    <main class="resource-container">

        <div id="loans-container">
            <p>Loading loans...</p>
        </div>

    </main>

    <script>

        const API_URL =
            "http://127.0.0.1:5000/api/resource/loans";

        async function loadLoans() {

            const container =
                document.getElementById("loans-container");

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load loans");
                }

                const loans = await response.json();

                container.innerHTML = "";

                loans.forEach(loan => {

                    const card =
                        document.createElement("div");

                    card.className = "resource-card";

                    card.innerHTML = `
                        <h2>${loan.name}</h2>

                        <p>
                            ${loan.description || ""}
                        </p>

                        <p>
                            <strong>Loan Amount:</strong>
                            ${loan.loan_amount || "As per lender"}
                        </p>

                        <p>
                            <strong>Interest Rate:</strong>
                            ${loan.interest_rate || "As per lender"}
                        </p>

                        <a
                            href="loan-details.html?id=${loan.id}"
                            class="details-button"
                        >
                            View Details
                        </a>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {

                console.error(error);

                container.innerHTML =
                    "<p>Unable to load loan options.</p>";
            }
        }

        loadLoans();
        function calculateEMI() {

    const principal =
        parseFloat(document.getElementById("loanAmount").value);

    const annualRate =
        parseFloat(document.getElementById("interestRate").value);

    const years =
        parseInt(document.getElementById("loanTenure").value);

    if (
        isNaN(principal) ||
        isNaN(annualRate) ||
        isNaN(years) ||
        principal <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {
        alert("Please enter valid loan details.");
        return;
    }

    const monthlyRate =
        annualRate / 12 / 100;

    const numberOfPayments =
        years * 12;

    let emi;

    if (monthlyRate === 0) {

        emi =
            principal / numberOfPayments;

    } else {

        emi =
            principal *
            monthlyRate *
            Math.pow(1 + monthlyRate, numberOfPayments) /
            (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
    }

    const totalPayment =
        emi * numberOfPayments;

    const totalInterest =
        totalPayment - principal;

    document.getElementById("monthly-emi").innerText =
        "₹" + emi.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });

    document.getElementById("total-interest").innerText =
        "₹" + totalInterest.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });

    document.getElementById("total-payment").innerText =
        "₹" + totalPayment.toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });
}

    </script>
    calculateEMI();

</body>
</html>
