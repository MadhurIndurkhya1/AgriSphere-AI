<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Details - AgriSphere AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>AgriSphere AI</h1>
        <p>Loan Details</p>
    </header>

    <main class="resource-details">

        <div id="loan-details-container">
            <p>Loading loan details...</p>
        </div>

    </main>

    <footer>
        AgriSphere AI © 2026
    </footer>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const loanId =
            params.get("id");

        const API_URL =
            `http://127.0.0.1:5000/api/resource/loans/${loanId}`;


        async function loadLoanDetails() {

            const container =
                document.getElementById(
                    "loan-details-container"
                );

            if (!loanId) {

                container.innerHTML =
                    "<p>Loan ID is missing.</p>";

                return;
            }

            try {

                const response =
                    await fetch(API_URL);

                if (!response.ok) {

                    throw new Error(
                        "Failed to load loan details"
                    );
                }

                const loan =
                    await response.json();


                container.innerHTML = `

                    <div class="details-card">

                        <h2>${loan.name}</h2>

                        <p>
                            <strong>Description:</strong><br>
                            ${loan.description || "Not available"}
                        </p>

                        <p>
                            <strong>Loan Amount:</strong><br>
                            ${loan.loan_amount || "As per lender"}
                        </p>

                        <p>
                            <strong>Interest Rate:</strong><br>
                            ${loan.interest_rate || "As per lender"}
                        </p>

                        <p>
                            <strong>Eligibility:</strong><br>
                            ${loan.eligibility || "Not available"}
                        </p>

                        <p>
                            <strong>Benefits:</strong><br>
                            ${loan.benefits || "Not available"}
                        </p>

                        <p>
                            <strong>Application Process:</strong><br>
                            ${loan.application_process || "Not available"}
                        </p>

                        <p>
                            <strong>Official Website:</strong><br>

                            <a
                                href="${loan.official_website}"
                                target="_blank"
                            >
                                Visit Official Website
                            </a>

                        </p>

                        <hr>

                        <h3>Apply / Request Assistance</h3>

                        <form
                            onsubmit="submitLoanRequest(event)"
                        >

                            <label for="customer-name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="customer-name"
                                required
                            >


                            <label for="customer-phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="customer-phone"
                                required
                            >


                            <label for="customer-location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="customer-location"
                                required
                            >


                            <label for="remarks">
                                Remarks
                            </label>

                            <textarea
                                id="remarks"
                                rows="4"
                            ></textarea>


                            <button
                                type="submit"
                            >
                                Apply / Request Assistance
                            </button>

                        </form>

                        <p id="loan-message"></p>

                    </div>

                `;

            } catch (error) {

                console.error(error);

                container.innerHTML =
                    "<p>Unable to load loan details.</p>";
            }
        }


        async function submitLoanRequest(event) {

    event.preventDefault();

    const name =
        document.getElementById("customer-name").value;

    const phone =
        document.getElementById("customer-phone").value;

    const location =
        document.getElementById("customer-location").value;

    const remarks =
        document.getElementById("remarks").value;

    const message =
        document.getElementById("loan-message");


    if (!name || !phone || !location) {

        message.innerText =
            "Please fill all required fields.";

        return;
    }


    try {

        const response = await fetch(
            `http://127.0.0.1:5000/api/resource/loans/${loanId}/request`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customer_name: name,
                    customer_phone: phone,
                    location: location,
                    remarks: remarks

                })
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            message.innerText =
                result.message ||
                "Request submission failed.";

            return;
        }


        message.innerText =
            `✅ ${result.message} Request ID: ${result.request_id}`;

    } catch (error) {

        console.error(error);

        message.innerText =
            "Unable to submit request. Please try again.";
    }
}


        loadLoanDetails();

    </script>

</body>

</html>
