<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manufacturer Details - AgriSphere AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>AgriSphere AI</h1>
        <p>Manufacturer Details</p>
    </header>

    <main>

        <section class="hero">
            <h2>🏭 Manufacturer Details</h2>
            <p>Complete information about the selected manufacturer.</p>
        </section>

        <section id="manufacturer-details" class="resource-details">

            <p>Loading manufacturer details...</p>

        </section>

    </main>

    <footer>
        <p>AgriSphere AI © 2026</p>
    </footer>


    <script>

        async function loadManufacturerDetails() {

            const detailsContainer =
                document.getElementById("manufacturer-details");

            const urlParams =
                new URLSearchParams(window.location.search);

            const manufacturerId =
                urlParams.get("id");


            if (!manufacturerId) {

                detailsContainer.innerHTML = `
                    <div class="details-card">
                        <h2>Manufacturer ID not found</h2>

                        <button onclick="goBack()">
                            ← Back to Manufacturers
                        </button>
                    </div>
                `;

                return;
            }


            try {

                const response = await fetch(
                    `http://127.0.0.1:5000/api/resource/manufacturers/${manufacturerId}`
                );


                if (!response.ok) {

                    throw new Error("Manufacturer not found");

                }


                const manufacturer =
                    await response.json();


                detailsContainer.innerHTML = `

                    <div class="details-card">

                        <h2>🏭 ${manufacturer.name}</h2>

                        <p>
                            <strong>Specialization:</strong>
                            ${manufacturer.specialization || "Not specified"}
                        </p>

                        <p>
                            <strong>Description:</strong>
                            ${manufacturer.description || "No description available"}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            ${manufacturer.location || "Not specified"}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${manufacturer.phone || "Not specified"}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${manufacturer.email || "Not specified"}
                        </p>

                        <p>
                            <strong>Rating:</strong>
                            ⭐ ${manufacturer.rating || "Not rated"}
                        </p>

                        <p>
                            <strong>Website:</strong>
                            ${manufacturer.website || "Not available"}
                        </p>


                        <div class="details-actions">

                            <button onclick="goBack()">
                                ← Back to Manufacturers
                            </button>

                        </div>

                    </div>

                `;

            }


            catch (error) {

                console.error(error);

                detailsContainer.innerHTML = `

                    <div class="details-card">

                        <h2>Manufacturer Not Found</h2>

                        <p>
                            Unable to load manufacturer details.
                        </p>

                        <button onclick="goBack()">
                            ← Back to Manufacturers
                        </button>

                    </div>

                `;

            }

        }


        function goBack() {

            window.location.href = "manufacturers.html";

        }


        // BUTTON ACTION:
        // Load selected manufacturer details from Resource Center API.

        loadManufacturerDetails();

    </script>

</body>

</html>
